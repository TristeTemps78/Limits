name: build

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: swift test (LimitsCore)
        run: swift test --package-path LimitsCore

  ipa:
    runs-on: macos-15
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Une version d'Xcode figee ne suffit PAS : le 2026-07-29, une image macos-15
      # portait bien Xcode_16.2 mais sans la plateforme iOS 18.2 installee, et l'archive
      # echouait sur « iOS 18.2 is not installed » alors que le meme commit passait sur
      # une autre image. On choisit donc le plus recent Xcode qui possede reellement un
      # SDK iphoneos, et on echoue avec un message explicite si aucun n'en a.
      - name: Select an Xcode that actually has the iOS SDK installed
        run: |
          set -euo pipefail
          chosen=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            if "$app/Contents/Developer/usr/bin/xcodebuild" -showsdks 2>/dev/null | grep -qi "iphoneos"; then
              chosen="$app"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            echo "::error::Aucun Xcode de ce runner n'a de SDK iphoneos installe."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$chosen"
          echo "XCODE_APP=$chosen" >> "$GITHUB_ENV"
          {
            echo "### Build environment"
            echo ""
            echo "- Xcode: \`$chosen\`"
            xcodebuild -version | sed 's/^/- /'
            xcodebuild -showsdks | grep -i "iphoneos" | sed 's/^/- SDK: /'
          } >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project (project.yml is the source of truth)
        run: xcodegen generate

      - name: Archive (unsigned — Sideloadly signs later)
        run: >
          xcodebuild -project Limits.xcodeproj -scheme Limits -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS'
          -archivePath build/Limits.xcarchive archive
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/Limits.xcarchive/Products/Applications/Limits.app build/Payload/

          # Classic silent failure: an IPA that "looks" valid but has no widget to pose
          # on the home/lock screen because the extension wasn't embedded.
          if [ ! -d "build/Payload/Limits.app/PlugIns/LimitsWidgets.appex" ]; then
            echo "::error::LimitsWidgets.appex missing from Limits.app/PlugIns — widget extension was not embedded."
            exit 1
          fi

          # Tracabilite : savoir quel commit et quel Xcode ont produit une IPA donnee,
          # sans avoir a remonter le run Actions correspondant.
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "xcode=${XCODE_APP:-unknown}"
          } > build/Payload/Limits.app/build-info.txt

          cd build && zip -r Limits.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Limits-ipa
          path: build/Limits.ipa

  release:
    runs-on: macos-15
    needs: ipa
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Limits-ipa
          path: build

      - name: Create GitHub release with IPA asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" build/Limits.ipa \
            --title "${{ github.ref_name }}" \
            --generate-notes
